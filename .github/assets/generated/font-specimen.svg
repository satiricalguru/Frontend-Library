<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="Envato award fonts specimen"><title>Envato award fonts specimen</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#1d2b63"/><stop offset="1" stop-color="#0b1020"/></radialGradient></defs><clipPath id="r"><rect width="720" height="450" rx="18"/></clipPath><g clip-path="url(#r)"><rect width="720" height="450" fill="url(#glow)"/><text x="32" y="48" fill="#8a97b8" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2">ENVATO · FONTS / AWARDS · 1,225 TYPEFACES</text><text x="32" y="110" fill="#e8eeff" font-family="'Snell Roundhand', 'Brush Script MT', cursive" font-style="italic" font-weight="400" font-size="46"> Bitthai Script</text><text x="34" y="134" fill="#8a97b8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">script and handwritten · also Abruptly, Acetylene</text><text x="32" y="196" fill="#e8eeff" font-family="Didot, 'Bodoni 72', Georgia, serif" font-style="normal" font-weight="700" font-size="46">Aguero Serif Rough</text><text x="34" y="220" fill="#8a97b8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">serif · also Aiditten Elegant Serif, Anstey</text><text x="32" y="282" fill="#e8eeff" font-family="'Rockwell', 'Copperplate', Impact, fantasy" font-style="normal" font-weight="700" font-size="46">Agoesa Display</text><text x="34" y="306" fill="#8a97b8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">decorative · also Arbatosh, Bonita</text><text x="32" y="368" fill="#e8eeff" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="normal" font-weight="800" font-size="46">Aftera</text><text x="34" y="392" fill="#8a97b8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">sans serif · also Aguero Sans Rough, Alicization</text><text x="688" y="428" text-anchor="end" fill="#8a97b8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">names set in system fonts · premium files stay on Envato</text></g></svg>
