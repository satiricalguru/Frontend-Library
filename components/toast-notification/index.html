<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast Notification</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
/* ── snippet ─────────────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column-reverse;
  gap: 12px;
  z-index: 9999;
  pointer-events: none;
  max-width: min(380px, calc(100vw - 32px));
  width: 100%;
}

.toast {
  pointer-events: auto;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: var(--panel, #121a30);
  border: 1px solid var(--line, #24304f);
  border-radius: 14px;
  color: var(--text, #e8eeff);
  box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.7);
  opacity: 0;
  transform: translateY(16px) scale(0.96);
  transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1),
              transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.toast.is-visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.toast.is-leaving {
  opacity: 0;
  transform: translateY(8px) scale(0.94);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast__icon {
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 1px;
}

.toast--success .toast__icon { color: var(--ok, #22c55e); }
.toast--info .toast__icon { color: var(--accent-2, #38bdf8); }
.toast--error .toast__icon { color: var(--bad, #ef4444); }

.toast__content {
  flex: 1;
  min-width: 0;
}

.toast__title {
  font: 600 14px/1.3 var(--font, system-ui, sans-serif);
  margin: 0 0 2px 0;
}

.toast__desc {
  font: 400 13px/1.4 var(--font, system-ui, sans-serif);
  color: var(--muted, #8a97b8);
  margin: 0;
}

.toast__close {
  flex: none;
  border: 0;
  background: none;
  color: var(--muted, #8a97b8);
  cursor: pointer;
  padding: 2px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}

.toast__close:hover {
  color: var(--text, #e8eeff);
  background: rgba(255, 255, 255, 0.08);
}

.toast__close:focus-visible {
  outline: 2px solid var(--accent-2, #38bdf8);
}

/* ── demo stage buttons ─────────────────────────────── */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  font: 600 13px/1 var(--font, system-ui, sans-serif);
  cursor: pointer;
  border: 1px solid var(--line, #24304f);
  background: var(--panel, #121a30);
  color: var(--text, #e8eeff);
  transition: border-color 0.18s, transform 0.1s;
}

.btn:hover {
  border-color: var(--accent-2, #38bdf8);
}

.btn:active {
  transform: scale(0.98);
}

@media (prefers-reduced-motion: reduce) {
  .toast {
    transition: opacity 0.01s;
    transform: none !important;
  }
}
</style>
</head>
<body>
<div class="stage">
  <div class="controls">
    <button class="btn" id="btn-success">Trigger Success</button>
    <button class="btn" id="btn-info">Trigger Info</button>
    <button class="btn" id="btn-error">Trigger Error</button>
  </div>
  <div class="caption">toast notifications</div>
</div>

<div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

<script>
// ── snippet ───────────────────────────────────────────
const ICONS = {
  success: '<svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
  info: '<svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  error: '<svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>'
};

function createToaster(container) {
  return function showToast({ type = 'info', title, message, duration = 4000 }) {
    const el = document.createElement('div');
    el.className = `toast toast--${type}`;
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');

    el.innerHTML = `
      ${ICONS[type] || ICONS.info}
      <div class="toast__content">
        <h4 class="toast__title">${title}</h4>
        ${message ? `<p class="toast__desc">${message}</p>` : ''}
      </div>
      <button class="toast__close" aria-label="Close notification">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    `;

    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('is-visible'));

    let timer = null;
    const dismiss = () => {
      if (el.classList.contains('is-leaving')) return;
      el.classList.add('is-leaving');
      el.addEventListener('transitionend', () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 300);
    };

    if (duration > 0) {
      timer = setTimeout(dismiss, duration);
      el.addEventListener('mouseenter', () => clearTimeout(timer));
      el.addEventListener('mouseleave', () => {
        timer = setTimeout(dismiss, duration);
      });
    }

    el.querySelector('.toast__close').addEventListener('click', dismiss);
  };
}

const toast = createToaster(document.getElementById('toast-container'));

// Demo event handlers
document.getElementById('btn-success').addEventListener('click', () => {
  toast({ type: 'success', title: 'Asset added', message: 'The component has been indexed successfully.' });
});
document.getElementById('btn-info').addEventListener('click', () => {
  toast({ type: 'info', title: 'Cache updated', message: 'Contributors SVG regenerated with latest commit data.' });
});
document.getElementById('btn-error').addEventListener('click', () => {
  toast({ type: 'error', title: 'Validation alert', message: 'Missing required link attribution field.' });
});

// Initial greeting demo
setTimeout(() => {
  toast({ type: 'success', title: 'Welcome to Frontend Library', message: 'Ready-to-use, dependency-free frontend snippets.' });
}, 600);
</script>
</body>
</html>
