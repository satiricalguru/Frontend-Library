<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast stack</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
/* ── snippet ─────────────────────────────────────────── */
.toasts {
  --gap: 10px; --peek: 12px;
  position: relative; width: min(360px, 92vw); height: 220px;
  display: flex; flex-direction: column-reverse; align-items: stretch;
}
.toast {
  --i: 0;
  position: absolute; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center;
  padding: 14px 14px 14px 12px; border-radius: 16px;
  background: color-mix(in srgb, var(--panel, #121a30) 92%, white 8%);
  border: 1px solid var(--line, #24304f); color: var(--text, #e8eeff);
  box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .7);
  /* collapsed: cards tuck behind the front one, smaller and dimmer */
  transform: translateY(calc(var(--i) * var(--peek) * -1)) scale(calc(1 - var(--i) * .05));
  opacity: calc(1 - var(--i) * .22);
  z-index: calc(10 - var(--i));
  transform-origin: 50% 100%;
  transition: transform .5s cubic-bezier(.2, .9, .3, 1.15), opacity .35s ease;
}
.toast > * { transition: opacity .3s ease; }
/* collapsed: only the front toast shows its content; the ones behind read as layered edges */
.toasts:not(:hover):not(:focus-within):not(.is-open) .toast.is-back > * { opacity: 0; }
.toast[data-hidden] { opacity: 0; pointer-events: none; }
.toast.is-enter { transform: translateY(110%) scale(.96); opacity: 0; }
.toast.is-leave { transform: translateX(110%) rotate(4deg); opacity: 0; transition-duration: .35s; }
/* expanded: hover or focus fans the stack out */
.toasts:hover .toast, .toasts:focus-within .toast, .toasts.is-open .toast {
  transform: translateY(calc(var(--i) * (100% + var(--gap)) * -1)); opacity: 1;
}
.toast__icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
.toast__icon.ok { background: color-mix(in srgb, #22c55e 18%, transparent); color: #3ee08f; }
.toast__icon.info { background: color-mix(in srgb, #38bdf8 18%, transparent); color: #7dd3fc; }
.toast__icon.warn { background: color-mix(in srgb, #f59e0b 18%, transparent); color: #fbbf24; }
.toast b { display: block; font-size: 14px; font-weight: 600; }
.toast small { display: block; font-size: 12.5px; color: var(--muted, #8a97b8); margin-top: 2px; }
.toast__close { border: 0; background: none; color: var(--muted, #8a97b8); font-size: 16px; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.toast__close:hover { color: var(--text, #e8eeff); background: rgba(255, 255, 255, .06); }
@media (prefers-reduced-motion: reduce) { .toast { transition: opacity .2s ease; } }

/* demo only */
.toasts-label { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="stage">
  <section class="toasts" id="toasts" aria-label="Notifications" aria-live="polite"></section>
  <div class="caption">toast stack</div>
</div>
<script>
// ── snippet ───────────────────────────────────────────
// createToaster(root, { max }) → push({ title, body, kind }) adds a toast; the stack keeps `max` visible.
function createToaster(root, { max = 3, timeout = 0 } = {}) {
  const layout = () => {
    const live = [...root.querySelectorAll('.toast:not(.is-leave)')].reverse(); // newest first
    live.forEach((t, i) => { t.style.setProperty('--i', String(i)); t.classList.toggle('is-back', i > 0); t.toggleAttribute('data-hidden', i >= max); });
  };
  const remove = (t) => {
    t.classList.add('is-leave');
    layout();
    t.addEventListener('transitionend', () => t.remove(), { once: true });
    setTimeout(() => t.remove(), 600);
  };
  const push = ({ title, body = '', kind = 'info' }) => {
    const t = document.createElement('article');
    t.className = 'toast is-enter';
    t.setAttribute('role', 'status');
    const icon = document.createElement('span');
    icon.className = `toast__icon ${kind}`;
    icon.textContent = kind === 'ok' ? '✓' : kind === 'warn' ? '!' : 'i';
    icon.setAttribute('aria-hidden', 'true');
    const text = document.createElement('div');
    const b = document.createElement('b'); b.textContent = title;
    const s = document.createElement('small'); s.textContent = body;
    text.append(b, s);
    const close = document.createElement('button');
    close.className = 'toast__close'; close.type = 'button'; close.textContent = '✕';
    close.setAttribute('aria-label', `Dismiss: ${title}`);
    close.addEventListener('click', () => remove(t));
    t.append(icon, text, close);
    root.append(t);
    layout();
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.remove('is-enter')));
    if (timeout) setTimeout(() => t.isConnected && remove(t), timeout);
    return t;
  };
  return { push, remove };
}

// demo loop: push toasts, fan the stack open, dismiss the oldest, repeat
const root = document.getElementById('toasts');
const toaster = createToaster(root, { max: 3 });
const feed = [
  { title: 'Palette copied', body: 'Linear · #08090a / #f7f8f8', kind: 'ok' },
  { title: '36 new captures', body: 'Brand homepages via Refero', kind: 'info' },
  { title: 'Rate limit close', body: 'GitHub API · 4 requests left', kind: 'warn' },
  { title: 'Snippet added', body: 'text-scramble/index.html', kind: 'ok' },
];
let n = 0;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
(async function loop() {
  while (true) {
    for (let k = 0; k < 3; k++) { toaster.push(feed[n++ % feed.length]); await wait(700); }
    await wait(500); root.classList.add('is-open');
    await wait(1400); root.classList.remove('is-open');
    await wait(600);
    for (const t of [...root.querySelectorAll('.toast')]) { toaster.remove(t); await wait(250); }
    await wait(500);
  }
})();
</script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
